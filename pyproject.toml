[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memehunter"
version = "0.1.0"
description = "Read-only Solana memecoin trend scanner with Telegram alerts"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
memehunter = "memehunter.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
